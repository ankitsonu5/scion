<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Construction | Scion International</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-premium.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg, #fcfbf9);
            font-family: var(--font-body, 'Inter', sans-serif);
            text-align: center;
        }

        .construction-container {
            padding: 40px;
            background: var(--color-surface, #ffffff);
            border: 1px solid rgba(15, 23, 42, 0.1);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            margin: 20px;
        }

        .logo-img {
            max-height: 80px;
            margin-bottom: 30px;
        }

        .construction-title {
            font-family: var(--font-heading, 'Geomatrix', Serif);
            font-size: 2.5rem;
            color: var(--color-primary, #0f172a);
            margin-bottom: 15px;
        }

        .construction-text {
            font-size: 1.1rem;
            color: var(--color-text-dim, #64748b);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-premium {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--color-accent, #d4af37);
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            background-color: var(--color-primary, #0f172a);
            color: var(--color-accent, #d4af37);
        }
    </style>
</head>
<body>

    <div class="construction-container">
        <a href="index-beta.html">
            <img src="assets/scion-logo.png" alt="Scion International" class="logo-img" onerror="this.src='https://placehold.co/200x80/white/000?text=Scion+Logo'">
        </a>
        <h1 class="construction-title">Site Under Construction</h1>
        <p class="construction-text">
            We are working hard to bring you a premium digital experience. 
            In the meantime, feel free to explore our beta site for a sneak peek into our luxury collections!
        </p>
        <a href="index-beta.html" class="btn-premium">Check Beta Site</a>
    </div>

</body>
</html>
